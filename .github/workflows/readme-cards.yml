name: Update README cards

# The public github-readme-stats.vercel.app deployment is paused, so the cards are generated here and committed.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fail_on_error + continue-on-error: a failed card keeps the last good SVG instead of an error card
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2.1.0
        continue-on-error: true
        with:
          card: stats
          options: username=virtualex-itv&show_icons=true&theme=nightowl&line_height=27
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2.1.0
        continue-on-error: true
        with:
          card: top-langs
          options: username=virtualex-itv&theme=nightowl
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Pin - itv-scripts
        uses: stats-organization/github-readme-stats-action@v2.1.0
        continue-on-error: true
        with:
          card: pin
          options: username=virtualex-itv&repo=itv-scripts&theme=dark
          path: profile/pin-itv-scripts.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Pin - chocolatey
        uses: stats-organization/github-readme-stats-action@v2.1.0
        continue-on-error: true
        with:
          card: pin
          options: username=virtualex-itv&repo=chocolatey&theme=dark
          path: profile/pin-chocolatey.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Pin - vmware-scripts
        uses: stats-organization/github-readme-stats-action@v2.1.0
        continue-on-error: true
        with:
          card: pin
          options: username=lamw&repo=vmware-scripts&theme=merko
          path: profile/pin-vmware-scripts.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
      - name: Pin - vcf-fleet-automated-lab-deployment
        uses: stats-organization/github-readme-stats-action@v2.1.0
        continue-on-error: true
        with:
          card: pin
          options: username=lamw&repo=vcf-fleet-automated-lab-deployment&theme=cobalt
          path: profile/pin-vcf-fleet-automated-lab-deployment.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
      - name: Pin - govmomi
        uses: stats-organization/github-readme-stats-action@v2.1.0
        continue-on-error: true
        with:
          card: pin
          options: username=vmware&repo=govmomi&theme=tokyonight
          path: profile/pin-govmomi.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
      - name: Pin - vChecker
        uses: stats-organization/github-readme-stats-action@v2.1.0
        continue-on-error: true
        with:
          card: pin
          options: username=soultecag&repo=vChecker&theme=gruvbox
          path: profile/pin-vchecker.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
      - name: Pin - homelab
        uses: stats-organization/github-readme-stats-action@v2.1.0
        continue-on-error: true
        with:
          card: pin
          options: username=lamw&repo=homelab&theme=radical
          path: profile/pin-homelab.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore(cards): update the README cards" || exit 0
          git push
